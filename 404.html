<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | InSite Group</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="images/insite-logo.svg" />
  <link rel="icon" type="image/png" href="images/insite-logo.png" />
  <meta name="theme-color" content="#1a1a18" />
  <link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Poppins:ital,wght@0,300;0,400;0,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #fff;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    nav {
      padding: 1.5rem 4rem;
      border-bottom: 1px solid #e8e0d8;
      display: flex;
      align-items: center;
    }
    nav img { height: 32px; width: auto; display: block; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 2rem;
    }
    .rule {
      width: 40px; height: 2px;
      background: #b08a4a;
      margin: 0 auto 2.5rem;
    }
    .code {
      font-family: 'Gilda Display', Georgia, serif;
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 400;
      color: #e8e0d8;
      line-height: 1;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
    }
    h1 {
      font-family: 'Gilda Display', Georgia, serif;
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 400;
      color: #1a1a1a;
      margin-bottom: 1rem;
    }
    p {
      font-size: 0.95rem;
      color: #888;
      font-weight: 300;
      line-height: 1.7;
      max-width: 420px;
      margin-bottom: 2.5rem;
    }
    a.btn {
      display: inline-block;
      padding: 1rem 2.8rem;
      border: 1px solid #1a1a1a;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #1a1a1a;
      text-decoration: none;
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }
    a.btn:hover {
      background: #b08a4a;
      color: #fff;
      border-color: #b08a4a;
    }
    footer {
      padding: 1.5rem 4rem;
      border-top: 1px solid #e8e0d8;
      text-align: center;
    }
    footer p {
      font-size: 0.72rem;
      color: #bbb;
      letter-spacing: 0.08em;
      margin: 0;
    }
    @media (max-width: 600px) {
      nav { padding: 1.2rem 1.5rem; }
      footer { padding: 1.2rem 1.5rem; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" aria-label="InSite Group - Home">
    <img src="images/insite-logo.svg" alt="InSite Group" />
  </a>
</nav>

<main>
  <div class="rule"></div>
  <div class="code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or may have been moved. Return to the homepage to explore InSite Group.</p>
  <a href="index.html" class="btn">Return to Home</a>
</main>

<footer>
  <p>© 2026 InSite Group. All rights reserved.</p>
</footer>

</body>
</html>
